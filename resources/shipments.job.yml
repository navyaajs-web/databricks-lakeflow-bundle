# Lakeflow Job: update the pipeline, then refresh the KPI history with SQL.

resources:
  jobs:
    shipments_daily:
      name: shipments-daily
      description: Updates the shipments pipeline, then snapshots lane KPIs into lane_kpi_history.
      # Two overlapping runs would race on the same pipeline update.
      max_concurrent_runs: 1
      timeout_seconds: 7200

      schedule:
        quartz_cron_expression: "0 30 5 * * ?" # 05:30 every day
        timezone_id: UTC
        # Paused by default; the prod target unpauses it. Development mode
        # pauses schedules regardless.
        pause_status: PAUSED

      tasks:
        - task_key: update_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.shipments_pipeline.id}
            full_refresh: false

        - task_key: refresh_lane_kpis
          depends_on:
            - task_key: update_pipeline
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/sql/refresh_lane_kpis.sql
              source: WORKSPACE
            parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.shipments.name}
          # Transient warehouse start-up errors are worth one retry; the SQL
          # itself is idempotent (REPLACE WHERE on the snapshot date).
          max_retries: 1
          min_retry_interval_millis: 60000

      tags:
        domain: logistics
